# 后台登录的滑块验证码（浏览器侧统一走 /app-api/captcha/get、/app-api/captcha/check）。
# 后端由 framework 的 AppCaptchaController 直接映射这个前缀，插件原生的 /captcha/** 不对外。
# 单独一个桶而不是复用其它 location：验证码只在该账号连续失败达阈值后才出现，
# 正常流量极低 —— 阈值可以取紧一些。应用侧还有一层按 clientUid 的分钟级限流
# （见 app.yml 的 aj.captcha.req-*），这里只按 IP 兜底。
limit_req_zone $binary_remote_addr zone=admin_captcha:10m rate=20r/m;

server {
    listen 80;
    server_name _;
    charset utf-8;
    client_max_body_size 100m;

    # 静态资源在构建期已经 minify，并额外生成了一份 `.gz`
    # （见 designer-ui/admin-web/plugins/compressAssets.js）。
    # `gzip_static on` 直接下发预压缩文件，省掉每个请求现压的 CPU；
    # 找不到同名 .gz 时自动回落到下面的 `gzip on`。
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # 被限时回 429（而不是 nginx 默认的 503），与后端 @RateLimit 的业务码口径一致：
    # 前端据此区分「请求过于频繁」和「服务真的挂了」。
    limit_req_status 429;

    # 前端静态资源
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后台管理 API（含 SSE）
    location /admin-api/ {
        proxy_pass http://server:8080/admin-api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 覆写而非追加：$proxy_add_x_forwarded_for 会把客户端自带的伪造链一并传给下游，
        # 后端取首段 → 攻击者填什么就是什么。单级可信代理下必须丢弃客户端传入链。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 前台公开 API
    location /app-api/ {
        proxy_pass http://server:8080/app-api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 第三方开放接口（含令牌端点 /open-api/oauth2/token）
    # 后端 8080 只绑定回环，第三方只能经这里访问；路径原样透传，不做改写。
    location /open-api/ {
        proxy_pass http://server:8080/open-api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 滑块验证码：公开前缀就是 /app-api/captcha/**（后端 AppCaptchaController 直接映射这个路径），
    # 所以这里不需要改写 URI，只负责把它的限流桶与普通 API 分开。
    # 这条比上面的 `location /app-api/` 长，前缀匹配取最长者，因此不会被它吞掉。
    location /app-api/captcha/ {
        # 每次响应都不同（随机底图 + 一次性 token），绝不能进缓存
        proxy_cache off;
        limit_req zone=admin_captcha burst=5 nodelay;
        proxy_pass http://server:8080/app-api/captcha/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 覆写而非追加：客户端伪造的转发链不该被后端采信（后端还有 TrustedProxyHostUtil 兜底）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 插件原生的 /captcha/** 不对外（浏览器侧只用 /app-api/captcha/**）。
    # 显式 404 而不是落进 `location /` 的 try_files：后者会返回 index.html，
    # 排查时表现为「JSON 解析失败」，而 404 能直接指出路径不对。
    location /captcha/ {
        return 404;
    }

    # 健康检查
    location = /health {
        proxy_pass http://server:8080/admin-api/system/health;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
