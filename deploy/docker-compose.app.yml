# 应用：Server + 管理后台（依赖已就绪的 MySQL / Redis）
# 用法：./deploy-app.sh
# 通过 .env 中 DB_* / REDIS_* 连接数据库（本机 Docker 库默认 host.docker.internal）

name: ${COMPOSE_PROJECT_NAME:-designer-admin}-app

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: designer-admin-server:${IMAGE_TAG:-1.0.0}
    container_name: designer-admin-server
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m -Dfile.encoding=UTF-8}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-designer_agent}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-5}
      # 配置密钥加密主密钥（可选；留空则存储/消息配置保持明文）
      VAULT_PASSWORD: ${VAULT_PASSWORD:-}
      # 接口文档开关（生产可关）
      KNIFE4J_ENABLE: ${KNIFE4J_ENABLE:-true}
      KNIFE4J_PRODUCTION: ${KNIFE4J_PRODUCTION:-false}
      # 智能体：Harness 工作区 + Milvus（本机 deploy-milvus 时用 host.docker.internal）
      AGENT_WORKSPACE: ${AGENT_WORKSPACE:-/app/data/agent-harness}
      MILVUS_URI: ${MILVUS_URI:-http://host.docker.internal:19530}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      MILVUS_DATABASE: ${MILVUS_DATABASE:-default}
    volumes:
      - server_uploads:/app/uploads
      - server_logs:/app/logs
      - server_agent_harness:/app/data/agent-harness
    ports:
      # 只绑定回环：server 不直接对外，所有流量必须经 nginx。
      # 否则攻击者可绕过 nginx 直连 8080 并伪造 X-Real-IP / X-Forwarded-For，IP 限流直接失效。
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 限制容器标准输出日志（应用控制台日志 / 启动报错）大小，避免撑满磁盘。
    # 应用自身的文件日志走 server_logs 卷，由应用侧的 maxHistory / totalSizeCap 控制。
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - designer-app-net

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: designer-admin-web:${IMAGE_TAG:-1.0.0}
    container_name: designer-admin-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
    # 限制 Nginx 访问 / 错误日志容器输出大小
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - designer-app-net

volumes:
  server_uploads:
  server_logs:
  server_agent_harness:

networks:
  designer-app-net:
    driver: bridge
